[package]
name = "wiki"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Standalone wiki CLI — seed, read, and search a markdown knowledge base."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["wiki", "knowledge-base", "markdown", "notes", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "wiki"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
regex = "1.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
walkdir = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
